[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "mlops_training"
version = "0.0.1"
description = "MLOps training"
authors = [
  { name = "Tyrone Russ" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "==3.13.14"


[tool.ruff]
line-length = 99
src = ["mlops_training"]
include = ["pyproject.toml", "mlops_training/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["mlops_training"]
force-sort-within-sections = true

